<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>もぐもぐハムスター - 2分チャレンジ</title><link rel="stylesheet" href="style.css"></head><body><div id="wrap"><div id="hud"><div class="top"><div class="stat">⏱️ <b id="timer">2:00</b></div><div class="stat">🐹 Lv.<b id="lv">1</b></div><div class="stat">成長<div class="bar"><div id="fill"></div></div></div><div class="stat scoreStat">SCORE <b id="score">0</b></div></div><div id="hint">2分チャレンジ。食べ物は6種類、枠なし。大きい物はかじるほど少しずつ削れていくよ</div></div><div id="game"><canvas id="canvas"></canvas><div id="toast"></div><div id="stick"><div id="knob"></div></div><div id="start" class="ov"><div class="card"><h1>もぐもぐハムスター</h1><p>世界と食べ物はセル基準、ハムスターは自由移動。<br>食べ物は6種類。小さい物は走りながらパクッ。<br>大きい物は立ち止まって、少しずつかじって食べるよ。<br><b>制限時間は2分！</b></p><button id="go">あそぶ</button></div></div><div id="result" class="ov" style="display:none"><div class="card"><h1>RESULT</h1><div class="big" id="fs">0</div><div class="res"><div>食べた数<b id="fe">0</b></div><div>最終Lv<b id="fl">1</b></div><div>ハムスター<b id="fh">1×1</b></div><div>最大食材<b id="ff">-</b></div></div><div class="actions"><button id="retry">リトライ</button><button id="exit" class="alt">終了</button></div></div></div></div></div><script src="game.js"></script></body></html>
