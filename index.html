<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>もぐもぐハムスター</title>
<style>
:root{--ink:#4c3424;--panel:#fff9ef;--a:#ef9350;--b:#db6b60}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;font-family:system-ui,-apple-system,sans-serif;background:#f0d7ac;color:var(--ink)}
#wrap{height:100%;display:flex;flex-direction:column}#hud{position:relative;z-index:10;background:#fff9eff7;padding:8px 10px;box-shadow:0 2px 12px #5032141f}.top{display:grid;grid-template-columns:auto auto 1fr auto;gap:6px;align-items:center}.stat{background:#fff;border-radius:12px;padding:7px 8px;font-size:12px;white-space:nowrap;box-shadow:0 2px 8px #0000000d}.bar{height:9px;background:#ead8bf;border-radius:999px;overflow:hidden;margin-top:4px}#fill{height:100%;width:0;background:linear-gradient(90deg,var(--a),var(--b))}#hint{text-align:center;font-size:11px;margin-top:6px;opacity:.78}
#game{position:relative;flex:1;overflow:hidden;background:#efd7ad;touch-action:none}canvas{display:block;width:100%;height:100%}#toast{position:absolute;z-index:12;left:50%;top:14px;transform:translateX(-50%);padding:9px 14px;border-radius:999px;background:#462d19e8;color:#fff;font-size:13px;white-space:nowrap;pointer-events:none;opacity:0;transition:.18s}
#stick{position:absolute;z-index:8;width:96px;height:96px;border:2px solid #4c342438;border-radius:50%;background:#fff9ef57;transform:translate(-50%,-50%);display:none;pointer-events:none}#knob{position:absolute;left:50%;top:50%;width:42px;height:42px;border-radius:50%;background:#4c342457;transform:translate(-50%,-50%)}
.ov{position:absolute;z-index:30;inset:0;display:flex;align-items:center;justify-content:center;padding:18px;background:#3c26144d}.card{width:min(92vw,430px);padding:22px;text-align:center;background:#fff8ec;border-radius:24px;box-shadow:0 20px 60px #321e0a40}.card h1{margin:0 0 8px;font-size:27px}.card p{font-size:14px;line-height:1.65}.big{font-size:42px;font-weight:900}.res{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0 16px}.res div{padding:10px;background:#fff;border-radius:14px;font-size:13px}.res b{display:block;font-size:20px;margin-top:3px}.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}button{border:0;border-radius:999px;padding:12px 22px;min-height:44px;color:#fff;font-size:16px;font-weight:800;background:linear-gradient(135deg,var(--a),var(--b))}button.alt{background:#76614f}@media(max-width:420px){.top{grid-template-columns:auto auto 1fr}.scoreStat{display:none}}
</style>
</head>
<body>
<div id="wrap"><div id="hud"><div class="top"><div class="stat">⏱️ <b id="timer">5:00</b></div><div class="stat">🐹 Lv.<b id="lv">1</b></div><div class="stat">成長<div class="bar"><div id="fill"></div></div></div><div class="stat scoreStat">SCORE <b id="score">0</b></div></div><div id="hint">マス目は世界の基準だけ。ハムスターは自由移動。小さい食べ物は走りながらパクッ！</div></div>
<div id="game"><canvas id="canvas"></canvas><div id="toast"></div><div id="stick"><div id="knob"></div></div>
<div id="start" class="ov"><div class="card"><h1>もぐもぐハムスター</h1><p>食べ物はセル基準の大きさだけど、ハムスターはマス目に縛られず自由に動けるよ。<br>小さい物は走りながらパクッ。大きい物だけ立ち止まってモグモグ。<br>5分でできるだけ大きく育てよう。</p><button id="go">あそぶ</button></div></div>
<div id="result" class="ov" style="display:none"><div class="card"><h1>RESULT</h1><div class="big" id="fs">0</div><div class="res"><div>食べた数<b id="fe">0</b></div><div>最終Lv<b id="fl">1</b></div><div>ハムスター<b id="fh">1×1</b></div><div>最大食材<b id="ff">-</b></div></div><div class="actions"><button id="retry">リトライ</button><button id="exit" class="alt">終了</button></div></div></div>
</div></div>
<script>
const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d'),game=document.getElementById('game');
const timerEl=document.getElementById('timer'),lvEl=document.getElementById('lv'),scoreEl=document.getElementById('score'),fill=document.getElementById('fill'),toast=document.getElementById('toast'),stick=document.getElementById('stick'),knob=document.getElementById('knob');
const CELL=56,CHUNK=10,RADIUS=2,GAME=300,LEVEL_XP=100,SPEED_MIN=55,SPEED_MAX=125,DEAD=14,STICK_MAX=34;
const TYPES=[
{name:'ひまわりの種',emoji:'🌻',w:1,h:1,need:1,xp:4,score:40},{name:'いちご',emoji:'🍓',w:1,h:1,need:1,xp:6,score:60},{name:'にんじん',emoji:'🥕',w:1,h:2,need:1,xp:8,score:80},{name:'クッキー',emoji:'🍪',w:2,h:2,need:1,xp:12,score:120},{name:'りんご',emoji:'🍎',w:2,h:2,need:2,xp:16,score:160},{name:'食パン',emoji:'🍞',w:3,h:2,need:2,xp:22,score:220},{name:'チーズ',emoji:'🧀',w:3,h:2,need:2,xp:28,score:280},{name:'ケーキ',emoji:'🍰',w:3,h:3,need:3,xp:36,score:360},{name:'スイカ',emoji:'🍉',w:4,h:4,need:3,xp:48,score:480},{name:'ピザ',emoji:'🍕',w:5,h:4,need:4,xp:62,score:620},{name:'巨大ケーキ',emoji:'🎂',w:5,h:5,need:4,xp:82,score:820}];
let playing=false,score=0,eaten=0,level=1,xp=0,hamSize=1,maxFood='-',maxArea=0,hamX=0,hamY=0,facing='down',moving=false,cameraX=0,cameraY=0,endAt=0,lastFrame=0,foods=[],chunks=new Set(),eatenIds=new Set(),eating=false,eatFood=null,eatStart=0,eatDuration=0,dpr=1;
let stickActive=false,pointerId=null,originX=0,originY=0,stickDX=0,stickDY=0;const keys={up:false,down:false,left:false,right:false};
function resize(){dpr=Math.max(1,Math.min(2,devicePixelRatio||1));const r=game.getBoundingClientRect();canvas.width=Math.floor(r.width*dpr);canvas.height=Math.floor(r.height*dpr);canvas.style.width=r.width+'px';canvas.style.height=r.height+'px';ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);
function flash(t){toast.textContent=t;toast.style.opacity=1;clearTimeout(flash.t);flash.t=setTimeout(()=>toast.style.opacity=0,850)}
function hash(x,y,s=0){let n=(x*374761393+y*668265263+s*69069)|0;n=(n^(n>>>13))*1274126177;return((n^(n>>>16))>>>0)/4294967296}
function hamPx(){return hamSize*CELL}function centerX(){return hamX+hamPx()/2}function centerY(){return hamY+hamPx()/2}function key(cx,cy){return cx+','+cy}
function overlaps(ax,ay,aw,ah,bx,by,bw,bh){return ax<bx+bw&&ax+aw>bx&&ay<by+bh&&ay+ah>by}
function rect(f){return{x:f.gx*CELL,y:f.gy*CELL,w:f.type.w*CELL,h:f.type.h*CELL}}
function generateChunk(cx,cy){const k=key(cx,cy);if(chunks.has(k))return;chunks.add(k);const placed=[];const count=7+Math.floor(hash(cx,cy,1)*6);for(let i=0;i<count;i++){let limit=Math.min(TYPES.length,Math.max(3,level+2)),idx=Math.floor(hash(cx,cy,100+i)*limit);if(hash(cx,cy,200+i)<.1)idx=Math.floor(hash(cx,cy,300+i)*TYPES.length);const type=TYPES[Math.max(0,Math.min(TYPES.length-1,idx))];let chosen=null;for(let a=0;a<8;a++){const gx=cx*CHUNK+Math.floor(hash(cx,cy,400+i*11+a)*Math.max(1,CHUNK-type.w)),gy=cy*CHUNK+Math.floor(hash(cx,cy,500+i*13+a)*Math.max(1,CHUNK-type.h));const hit=placed.some(p=>overlaps(gx,gy,type.w,type.h,p.gx,p.gy,p.w,p.h));if(!hit){chosen={gx,gy};break}}if(!chosen)continue;placed.push({gx:chosen.gx,gy:chosen.gy,w:type.w,h:type.h});const id=`${cx}:${cy}:${i}`;if(!eatenIds.has(id))foods.push({id,gx:chosen.gx,gy:chosen.gy,type})}}
function ensureChunks(){const ccx=Math.floor((centerX()/CELL)/CHUNK),ccy=Math.floor((centerY()/CELL)/CHUNK);for(let y=ccy-RADIUS;y<=ccy+RADIUS;y++)for(let x=ccx-RADIUS;x<=ccx+RADIUS;x++)generateChunk(x,y);foods=foods.filter(f=>Math.abs(Math.floor(f.gx/CHUNK)-ccx)<=RADIUS+1&&Math.abs(Math.floor(f.gy/CHUNK)-ccy)<=RADIUS+1);for(const k of [...chunks]){const [x,y]=k.split(',').map(Number);if(Math.abs(x-ccx)>RADIUS+1||Math.abs(y-ccy)>RADIUS+1)chunks.delete(k)}}
function hideStick(){stick.style.display='none';knob.style.transform='translate(-50%,-50%)';stickActive=false;pointerId=null;stickDX=stickDY=0}
function reset(){score=eaten=0;level=1;xp=0;hamSize=1;maxFood='-';maxArea=0;hamX=hamY=-CELL/2;facing='down';moving=false;cameraX=cameraY=0;foods=[];chunks.clear();eatenIds.clear();eating=false;eatFood=null;lvEl.textContent='1';scoreEl.textContent='0';fill.style.width='0%';timerEl.textContent='5:00';hideStick();ensureChunks()}
function updateSize(){hamSize=level>=10?4:level>=7?3:level>=4?2:1}
function levelUp(){while(xp>=LEVEL_XP){xp-=LEVEL_XP;level++;updateSize();flash(`LEVEL UP! ${hamSize}×${hamSize}`)}lvEl.textContent=level;fill.style.width=Math.min(100,xp/LEVEL_XP*100)+'%'}
function reward(f,msg){const i=foods.findIndex(v=>v.id===f.id);if(i<0)return;eatenIds.add(f.id);foods.splice(i,1);eaten++;score+=f.type.score;xp+=f.type.xp;const a=f.type.w*f.type.h;if(a>maxArea){maxArea=a;maxFood=f.type.name}scoreEl.textContent=score;flash(`${f.type.emoji} ${msg} +${f.type.score}`);levelUp()}
function smallEnough(f){return f.type.w*f.type.h<=hamSize*hamSize}
function startEat(f){if(eating)return;eating=true;eatFood=f;eatStart=performance.now();eatDuration=Math.max(380,360+f.type.w*f.type.h*70-(hamSize-1)*85);flash(`${f.type.emoji} ${f.type.name} をモグモグ…`)}
function updateEating(now){if(eating&&now-eatStart>=eatDuration){const f=eatFood;if(f&&foods.some(v=>v.id===f.id))reward(f,'ごちそうさま！');eating=false;eatFood=null}}
function eatProgress(now){return eating&&eatDuration?Math.max(0,Math.min(1,(now-eatStart)/eatDuration)):0}
function checkFood(){if(eating)return;const hs=hamPx();for(let i=foods.length-1;i>=0;i--){const f=foods[i],r=rect(f);if(!overlaps(hamX,hamY,hs,hs,r.x,r.y,r.w,r.h))continue;if(hamSize<f.type.need)continue;if(smallEnough(f)){reward(f,'パクッ！');continue}startEat(f);return}}
function input(){let x=stickActive?stickDX:0,y=stickActive?stickDY:0;if(keys.left)x-=STICK_MAX;if(keys.right)x+=STICK_MAX;if(keys.up)y-=STICK_MAX;if(keys.down)y+=STICK_MAX;const len=Math.hypot(x,y);if(!len)return{nx:0,ny:0,p:0};return{nx:x/len,ny:y/len,p:Math.max(0,Math.min(1,(len-DEAD)/(STICK_MAX-DEAD)))}}
function updateMove(dt){moving=false;if(!playing||eating)return;const q=input();if(!q.p)return;moving=true;facing=Math.abs(q.nx)>Math.abs(q.ny)?(q.nx<0?'left':'right'):(q.ny<0?'up':'down');const speed=SPEED_MIN+(SPEED_MAX-SPEED_MIN)*q.p;hamX+=q.nx*speed*dt/1000;hamY+=q.ny*speed*dt/1000;ensureChunks();checkFood()}
function updateTimer(){if(!playing)return;const ms=Math.max(0,endAt-performance.now()),s=Math.ceil(ms/1000);timerEl.textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0');if(ms<=0)finish()}
function startGame(){reset();document.getElementById('start').style.display='none';document.getElementById('result').style.display='none';playing=true;endAt=performance.now()+GAME*1000;lastFrame=performance.now()}
function finish(){if(!playing)return;playing=false;moving=false;eating=false;eatFood=null;hideStick();document.getElementById('fs').textContent=score;document.getElementById('fe').textContent=eaten;document.getElementById('fl').textContent=level;document.getElementById('fh').textContent=`${hamSize}×${hamSize}`;document.getElementById('ff').textContent=maxFood;document.getElementById('result').style.display='flex'}
function roundRect(x,y,w,h,r){r=Math.min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function drawGrid(w,h){ctx.fillStyle='#f0d7ac';ctx.fillRect(0,0,w,h);const sx=Math.floor(cameraX/CELL)-2,ex=Math.ceil((cameraX+w)/CELL)+2,sy=Math.floor(cameraY/CELL)-2,ey=Math.ceil((cameraY+h)/CELL)+2;for(let gy=sy;gy<=ey;gy++)for(let gx=sx;gx<=ex;gx++)if(((gx+gy)&1)===0){ctx.fillStyle='rgba(255,255,255,.035)';ctx.fillRect(gx*CELL-cameraX,gy*CELL-cameraY,CELL,CELL)}ctx.strokeStyle='rgba(100,72,45,.14)';ctx.lineWidth=1;for(let gx=sx;gx<=ex;gx++){const x=Math.round(gx*CELL-cameraX)+.5;ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke()}for(let gy=sy;gy<=ey;gy++){const y=Math.round(gy*CELL-cameraY)+.5;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke()}}
function drawFood(f,now){const r=rect(f),x=r.x-cameraX,y=r.y-cameraY,w=r.w,h=r.h,p=eating&&eatFood&&eatFood.id===f.id?eatProgress(now):0,scale=1-p*.38;ctx.save();ctx.globalAlpha=1-p*.38;ctx.translate(x+w/2,y+h/2);ctx.scale(scale,scale);ctx.translate(-w/2,-h/2);ctx.fillStyle='rgba(255,249,239,.45)';ctx.strokeStyle='rgba(94,63,38,.23)';ctx.lineWidth=2;roundRect(4,4,w-8,h-8,12);ctx.fill();ctx.stroke();ctx.font=`${Math.min(w,h)*.58}px system-ui`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(f.type.emoji,w/2,h/2-2);ctx.font='bold 11px system-ui';ctx.fillStyle='#432e1fdb';ctx.fillText(`${f.type.w}×${f.type.h}`,w/2,h-13);ctx.restore()}
function drawHam(now){const s=hamPx(),x=hamX-cameraX,y=hamY-cameraY,m=eating?Math.sin((now-eatStart)/55):0,b=moving?Math.sin(now/70)*2.2:eating?m*1.8:0;ctx.save();ctx.translate(x+s/2,y+s/2+b);if(eating)ctx.scale(1/(1+m*.035),1+m*.035);ctx.fillStyle='#c9935f';ctx.strokeStyle='#8e633f';ctx.lineWidth=3;if(facing==='left'||facing==='right'){ctx.scale(facing==='left'?-1:1,1);ctx.beginPath();ctx.ellipse(0,0,s*.42,s*.31,0,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.fillStyle='#c9935f';ctx.beginPath();ctx.arc(s*.14,-s*.25,s*.10,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.fillStyle='#f3b3a5';ctx.beginPath();ctx.arc(s*.14,-s*.25,s*.055,0,Math.PI*2);ctx.fill();ctx.fillStyle='#24170f';ctx.beginPath();ctx.arc(s*.22,-s*.07,s*.04,0,Math.PI*2);ctx.fill();ctx.fillStyle='#df7a75';ctx.beginPath();ctx.arc(s*.42,s*.01,s*.045,0,Math.PI*2);ctx.fill();ctx.fillStyle='#efd2aa';ctx.beginPath();ctx.arc(-s*.42,s*.04,s*.075,0,Math.PI*2);ctx.fill();ctx.stroke()}else if(facing==='up'){ctx.beginPath();ctx.ellipse(0,0,s*.37,s*.39,0,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.fillStyle='#c9935f';ctx.beginPath();ctx.arc(-s*.22,-s*.29,s*.11,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.beginPath();ctx.arc(s*.22,-s*.29,s*.11,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.fillStyle='#efd2aa';ctx.beginPath();ctx.arc(s*.18,s*.25,s*.08,0,Math.PI*2);ctx.fill();ctx.stroke()}else{ctx.beginPath();ctx.ellipse(0,0,s*.37,s*.39,0,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.fillStyle='#c9935f';ctx.beginPath();ctx.arc(-s*.22,-s*.29,s*.11,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.beginPath();ctx.arc(s*.22,-s*.29,s*.11,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.fillStyle='#f3b3a5';ctx.beginPath();ctx.arc(-s*.22,-s*.29,s*.06,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(s*.22,-s*.29,s*.06,0,Math.PI*2);ctx.fill();ctx.fillStyle='#24170f';ctx.beginPath();ctx.arc(-s*.13,-s*.08,s*.04,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(s*.13,-s*.08,s*.04,0,Math.PI*2);ctx.fill();ctx.fillStyle='#df7a75';ctx.beginPath();ctx.arc(0,s*.02,s*.045,0,Math.PI*2);ctx.fill();if(eating){ctx.fillStyle='#5a3327';ctx.beginPath();ctx.ellipse(0,s*.105,s*.06,s*(.035+Math.abs(m)*.045),0,0,Math.PI*2);ctx.fill()}ctx.fillStyle='#efd2aa';ctx.beginPath();ctx.ellipse(0,s*.18,s*.18,s*.12,0,0,Math.PI*2);ctx.fill()}ctx.restore();if(eating&&eatFood){const p=eatProgress(now),bw=Math.max(72,Math.min(s,150)),bx=x+s/2-bw/2,by=y-24;ctx.fillStyle='#4c3424c7';roundRect(bx,by,bw,10,5);ctx.fill();ctx.fillStyle='#fff0ca';roundRect(bx+2,by+2,(bw-4)*p,6,3);ctx.fill();ctx.font='bold 12px system-ui';ctx.textAlign='center';ctx.fillStyle='#4c3424';ctx.fillText('もぐもぐ…',x+s/2,by-5)}}
function draw(now){const w=game.clientWidth,h=game.clientHeight;cameraX+=(centerX()-w/2-cameraX)*.16;cameraY+=(centerY()-h/2-cameraY)*.16;drawGrid(w,h);const pad=CELL*2;for(const f of foods){const r=rect(f),x=r.x-cameraX,y=r.y-cameraY;if(x+r.w<-pad||y+r.h<-pad||x>w+pad||y>h+pad)continue;drawFood(f,now)}drawHam(now)}
function loop(now){if(!lastFrame)lastFrame=now;const dt=Math.min(33,now-lastFrame);lastFrame=now;updateMove(dt);updateEating(now);if(!eating)checkFood();updateTimer();draw(now);requestAnimationFrame(loop)}
game.addEventListener('pointerdown',e=>{if(!playing)return;if(e.pointerType==='mouse'&&e.button!==0)return;stickActive=true;pointerId=e.pointerId;originX=e.clientX;originY=e.clientY;stickDX=stickDY=0;const r=game.getBoundingClientRect();stick.style.left=e.clientX-r.left+'px';stick.style.top=e.clientY-r.top+'px';stick.style.display='block';knob.style.transform='translate(-50%,-50%)';try{game.setPointerCapture(e.pointerId)}catch(_){}});
game.addEventListener('pointermove',e=>{if(!stickActive||e.pointerId!==pointerId)return;stickDX=e.clientX-originX;stickDY=e.clientY-originY;const len=Math.hypot(stickDX,stickDY);let x=stickDX,y=stickDY;if(len>STICK_MAX){x=stickDX/len*STICK_MAX;y=stickDY/len*STICK_MAX}const p=Math.max(0,Math.min(1,(len-DEAD)/(STICK_MAX-DEAD)));knob.style.transform=`translate(calc(-50% + ${x}px),calc(-50% + ${y}px)) scale(${1+p*.14})`});
function endStick(e){if(!stickActive||e.pointerId!==pointerId)return;try{if(game.hasPointerCapture(e.pointerId))game.releasePointerCapture(e.pointerId)}catch(_){}hideStick()}game.addEventListener('pointerup',endStick);game.addEventListener('pointercancel',endStick);
addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key))e.preventDefault();if(e.key==='ArrowUp')keys.up=true;if(e.key==='ArrowDown')keys.down=true;if(e.key==='ArrowLeft')keys.left=true;if(e.key==='ArrowRight')keys.right=true},{passive:false});addEventListener('keyup',e=>{if(e.key==='ArrowUp')keys.up=false;if(e.key==='ArrowDown')keys.down=false;if(e.key==='ArrowLeft')keys.left=false;if(e.key==='ArrowRight')keys.right=false});
document.getElementById('go').onclick=startGame;document.getElementById('retry').onclick=startGame;document.getElementById('exit').onclick=()=>{document.getElementById('result').style.display='none';document.getElementById('start').style.display='flex';reset()};resize();reset();requestAnimationFrame(loop);
</script>
</body></html>
