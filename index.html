<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>もぐもぐハムスター</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;font-family:system-ui,sans-serif;background:#f0d7ac;color:#4c3424}#wrap{height:100%;display:flex;flex-direction:column}#hud{z-index:5;background:#fff9efee;padding:8px 10px;box-shadow:0 2px 10px #0002}.top{display:grid;grid-template-columns:auto auto 1fr auto;gap:6px;align-items:center}.stat{background:#fff;border-radius:12px;padding:7px 8px;font-size:12px;white-space:nowrap}.bar{height:9px;background:#ead8bf;border-radius:99px;overflow:hidden;margin-top:4px}#fill{height:100%;width:0;background:linear-gradient(90deg,#ef9350,#db6b60)}#hint{text-align:center;font-size:11px;opacity:.75;margin-top:5px}#game{position:relative;flex:1;overflow:hidden;touch-action:none}canvas{width:100%;height:100%;display:block}#toast{position:absolute;top:14px;left:50%;transform:translateX(-50%);background:#4c3424e8;color:#fff;padding:8px 13px;border-radius:99px;font-size:13px;opacity:0;transition:.15s;pointer-events:none;white-space:nowrap}#stick{position:absolute;width:96px;height:96px;border-radius:50%;border:2px solid #4c342438;background:#fff7e84f;transform:translate(-50%,-50%);display:none;pointer-events:none}#knob{position:absolute;left:50%;top:50%;width:42px;height:42px;border-radius:50%;background:#4c342457;transform:translate(-50%,-50%)}.ov{position:absolute;inset:0;background:#3c26144d;display:flex;align-items:center;justify-content:center;padding:18px;z-index:20}.card{width:min(92vw,430px);background:#fff8ec;border-radius:24px;padding:22px;text-align:center;box-shadow:0 18px 55px #0003}.card h1{margin:0 0 8px}.card p{font-size:14px;line-height:1.65}.big{font-size:42px;font-weight:900}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0 16px}.grid div{background:#fff;border-radius:14px;padding:10px;font-size:13px}.grid b{display:block;font-size:20px}button{border:0;border-radius:99px;padding:12px 22px;color:#fff;font-size:16px;font-weight:800;background:#ef9350;margin:4px}button.alt{background:#76614f}@media(max-width:420px){.top{grid-template-columns:auto auto 1fr}.scoreStat{display:none}}
</style></head><body><div id="wrap"><div id="hud"><div class="top"><div class="stat">⏱️ <b id="timer">5:00</b></div><div class="stat">🐹 Lv.<b id="lv">1</b></div><div class="stat">成長<div class="bar"><div id="fill"></div></div></div><div class="stat scoreStat">SCORE <b id="score">0</b></div></div><div id="hint">世界と食べ物はマス目、ハムスターだけ自由移動。小さい物は走りながらパクッ！</div></div><div id="game"><canvas id="c"></canvas><div id="toast"></div><div id="stick"><div id="knob"></div></div><div id="start" class="ov"><div class="card"><h1>もぐもぐハムスター</h1><p>世界と食べ物はセルでできているけど、ハムスターだけは自由に移動できるよ。<br>小さい食べ物は走りながら食べ、大きい物は立ち止まってモグモグ。<br>5分でできるだけ大きく育てよう。</p><button id="go">あそぶ</button></div></div><div id="result" class="ov" style="display:none"><div class="card"><h1>RESULT</h1><div class="big" id="fs">0</div><div class="grid"><div>食べた数<b id="fe">0</b></div><div>最終Lv<b id="fl">1</b></div><div>ハムスター<b id="fh">1×1</b></div><div>最大食材<b id="ff">-</b></div></div><button id="retry">リトライ</button><button id="exit" class="alt">終了</button></div></div></div></div><script>
const c=document.getElementById('c'),x=c.getContext('2d'),game=document.getElementById('game'),CELL=56,CH=10,R=2,TIME=300,XP=100,SMIN=55,SMAX=125,DZ=14,SM=34;const timer=document.getElementById('timer'),lv=document.getElementById('lv'),scoreEl=document.getElementById('score'),fill=document.getElementById('fill'),toast=document.getElementById('toast'),stick=document.getElementById('stick'),knob=document.getElementById('knob');const F=[['ひまわりの種','🌻',1,1,1,4,40],['いちご','🍓',1,1,1,6,60],['にんじん','🥕',1,2,1,8,80],['クッキー','🍪',2,2,1,12,120],['りんご','🍎',2,2,2,16,160],['食パン','🍞',3,2,2,22,220],['チーズ','🧀',3,2,2,28,280],['ケーキ','🍰',3,3,3,36,360],['スイカ','🍉',4,4,3,48,480],['ピザ','🍕',5,4,4,62,620],['巨大ケーキ','🎂',5,5,4,82,820]].map(a=>({n:a[0],e:a[1],w:a[2],h:a[3],need:a[4],xp:a[5],s:a[6]}));let playing=false,score=0,eaten=0,level=1,xp=0,hs=1,maxN='-',maxA=0,hx=0,hy=0,face='down',moving=false,camx=0,camy=0,endAt=0,last=0,foods=[],chunks=new Set(),eatenIds=new Set(),eating=false,eatF=null,eatStart=0,eatDur=0,active=false,pid=null,ox=0,oy=0,dx=0,dy=0,dpr=1;const keys={up:0,down:0,left:0,right:0};
function resize(){dpr=Math.max(1,Math.min(2,devicePixelRatio||1));let r=game.getBoundingClientRect();c.width=r.width*dpr;c.height=r.height*dpr;c.style.width=r.width+'px';c.style.height=r.height+'px';x.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);function flash(t){toast.textContent=t;toast.style.opacity=1;clearTimeout(flash.t);flash.t=setTimeout(()=>toast.style.opacity=0,800)}function h2(a,b,s=0){let n=(a*374761393+b*668265263+s*69069)|0;n=(n^(n>>>13))*1274126177;return((n^(n>>>16))>>>0)/4294967296}function hp(){return hs*CELL}function cx(){return hx+hp()/2}function cy(){return hy+hp()/2}function ck(a,b){return a+','+b}
function gen(a,b){let k=ck(a,b);if(chunks.has(k))return;chunks.add(k);let n=7+Math.floor(h2(a,b,1)*7);for(let i=0;i<n;i++){let lim=Math.min(F.length,Math.max(3,level+2)),j=Math.floor(h2(a,b,100+i)*lim);if(h2(a,b,200+i)<.12)j=Math.floor(h2(a,b,300+i)*F.length);let t=F[Math.min(F.length-1,j)],gx=a*CH+Math.floor(h2(a,b,400+i)*Math.max(1,CH-t.w)),gy=b*CH+Math.floor(h2(a,b,500+i)*Math.max(1,CH-t.h)),id=`${a}:${b}:${i}`;if(!eatenIds.has(id))foods.push({id,gx,gy,t})}}
function near(){let a=Math.floor((cx()/CELL)/CH),b=Math.floor((cy()/CELL)/CH);for(let yy=b-R;yy<=b+R;yy++)for(let xx=a-R;xx<=a+R;xx++)gen(xx,yy);foods=foods.filter(f=>Math.abs(Math.floor(f.gx/CH)-a)<=R+1&&Math.abs(Math.floor(f.gy/CH)-b)<=R+1);for(let k of [...chunks]){let[q,w]=k.split(',').map(Number);if(Math.abs(q-a)>R+1||Math.abs(w-b)>R+1)chunks.delete(k)}}
function reset(){score=eaten=0;level=1;xp=0;hs=1;maxN='-';maxA=0;hx=hy=-CELL/2;face='down';moving=false;camx=camy=0;foods=[];chunks.clear();eatenIds.clear();eating=false;eatF=null;lv.textContent=1;scoreEl.textContent=0;fill.style.width='0%';timer.textContent='5:00';hide();near()}
function sizeUp(){hs=level>=10?4:level>=7?3:level>=4?2:1}function lev(){while(xp>=XP){xp-=XP;level++;sizeUp();flash(`LEVEL UP! ${hs}×${hs}`)}lv.textContent=level;fill.style.width=(xp/XP*100)+'%'}function ov(a,b,c,d,e,f,g,h){return a<e+g&&a+c>e&&b<f+h&&b+d>f}function fr(f){return{x:f.gx*CELL,y:f.gy*CELL,w:f.t.w*CELL,h:f.t.h*CELL}}function reward(f,msg){let i=foods.findIndex(z=>z.id===f.id);if(i<0)return;eatenIds.add(f.id);foods.splice(i,1);eaten++;score+=f.t.s;xp+=f.t.xp;let a=f.t.w*f.t.h;if(a>maxA){maxA=a;maxN=f.t.n}scoreEl.textContent=score;flash(`${f.t.e} ${msg} +${f.t.s}`);lev()}function instant(f){return f.t.w*f.t.h<=hs*hs}function startEat(f){if(eating)return;eating=true;eatF=f;eatStart=performance.now();eatDur=Math.max(380,360+f.t.w*f.t.h*70-(hs-1)*85);flash(`${f.t.e} ${f.t.n} をモグモグ…`)}function eatUpdate(n){if(eating&&n-eatStart>=eatDur){let f=eatF;if(f&&foods.some(z=>z.id===f.id))reward(f,'ごちそうさま！');eating=false;eatF=null}}
function check(){if(eating)return;let z=hp();for(let i=foods.length-1;i>=0;i--){let f=foods[i],r=fr(f);if(ov(hx,hy,z,z,r.x,r.y,r.w,r.h)){if(hs<f.t.need)continue;if(instant(f)){reward(f,'パクッ！');continue}startEat(f);return}}}
function input(){let a=active?dx:0,b=active?dy:0;if(keys.left)a-=SM;if(keys.right)a+=SM;if(keys.up)b-=SM;if(keys.down)b+=SM;let l=Math.hypot(a,b);if(!l)return{nx:0,ny:0,p:0};return{nx:a/l,ny:b/l,p:Math.max(0,Math.min(1,(l-DZ)/(SM-DZ)))}}function move(dt){moving=false;if(!playing||eating)return;let q=input();if(!q.p)return;moving=true;face=Math.abs(q.nx)>Math.abs(q.ny)?(q.nx<0?'left':'right'):(q.ny<0?'up':'down');let s=SMIN+(SMAX-SMIN)*q.p;hx+=q.nx*s*dt/1000;hy+=q.ny*s*dt/1000;near();check()}
function time(){if(!playing)return;let ms=Math.max(0,endAt-performance.now()),s=Math.ceil(ms/1000);timer.textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0');if(!ms)finish()}function finish(){if(!playing)return;playing=false;moving=false;eating=false;hide();document.getElementById('fs').textContent=score;document.getElementById('fe').textContent=eaten;document.getElementById('fl').textContent=level;document.getElementById('fh').textContent=`${hs}×${hs}`;document.getElementById('ff').textContent=maxN;document.getElementById('result').style.display='flex'}function start(){reset();document.getElementById('start').style.display='none';document.getElementById('result').style.display='none';playing=true;endAt=performance.now()+TIME*1000;last=performance.now()}
function rr(a,b,w,h,r){r=Math.min(r,w/2,h/2);x.beginPath();x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+h,r);x.arcTo(a+w,b+h,a,b+h,r);x.arcTo(a,b+h,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath()}function grid(w,h){x.fillStyle='#f0d7ac';x.fillRect(0,0,w,h);let sx=Math.floor(camx/CELL)-2,ex=Math.ceil((camx+w)/CELL)+2,sy=Math.floor(camy/CELL)-2,ey=Math.ceil((camy+h)/CELL)+2;x.strokeStyle='#64482d24';x.lineWidth=1;for(let g=sx;g<=ex;g++){let p=Math.round(g*CELL-camx)+.5;x.beginPath();x.moveTo(p,0);x.lineTo(p,h);x.stroke()}for(let g=sy;g<=ey;g++){let p=Math.round(g*CELL-camy)+.5;x.beginPath();x.moveTo(0,p);x.lineTo(w,p);x.stroke()}}
function food(f,n){let r=fr(f),a=r.x-camx,b=r.y-camy,w=r.w,h=r.h,p=eating&&eatF&&eatF.id===f.id?Math.min(1,(n-eatStart)/eatDur):0,sc=1-p*.38;x.save();x.globalAlpha=1-p*.38;x.translate(a+w/2,b+h/2);x.scale(sc,sc);x.translate(-w/2,-h/2);x.fillStyle='#fff9ef77';x.strokeStyle='#5e3f263b';x.lineWidth=2;rr(4,4,w-8,h-8,12);x.fill();x.stroke();x.font=Math.min(w,h)*.58+'px system-ui';x.textAlign='center';x.textBaseline='middle';x.fillText(f.t.e,w/2,h/2-2);x.font='bold 11px system-ui';x.fillStyle='#432e1fdb';x.fillText(`${f.t.w}×${f.t.h}`,w/2,h-13);x.restore()}
function ham(n){let s=hp(),a=hx-camx,b=hy-camy,m=eating?Math.sin((n-eatStart)/55):0,bo=moving?Math.sin(n/70)*2.2:eating?m*1.8:0;x.save();x.translate(a+s/2,b+s/2+bo);if(eating)x.scale(1/(1+m*.035),1+m*.035);x.fillStyle='#c9935f';x.strokeStyle='#8e633f';x.lineWidth=3;if(face==='left'||face==='right'){x.scale(face==='left'?-1:1,1);x.beginPath();x.ellipse(0,0,s*.42,s*.31,0,0,7);x.fill();x.stroke();x.fillStyle='#24170f';x.beginPath();x.arc(s*.22,-s*.07,s*.04,0,7);x.fill();x.fillStyle='#df7a75';x.beginPath();x.arc(s*.42,s*.01,s*.045,0,7);x.fill();x.fillStyle='#efd2aa';x.beginPath();x.arc(-s*.42,s*.04,s*.075,0,7);x.fill()}else{x.beginPath();x.ellipse(0,0,s*.37,s*.39,0,0,7);x.fill();x.stroke();x.fillStyle='#c9935f';x.beginPath();x.arc(-s*.22,-s*.29,s*.11,0,7);x.fill();x.beginPath();x.arc(s*.22,-s*.29,s*.11,0,7);x.fill();if(face!=='up'){x.fillStyle='#24170f';x.beginPath();x.arc(-s*.13,-s*.08,s*.04,0,7);x.fill();x.beginPath();x.arc(s*.13,-s*.08,s*.04,0,7);x.fill();x.fillStyle='#df7a75';x.beginPath();x.arc(0,s*.02,s*.045,0,7);x.fill()}else{x.fillStyle='#efd2aa';x.beginPath();x.arc(s*.18,s*.25,s*.08,0,7);x.fill()}}x.restore();if(eating){let p=Math.min(1,(n-eatStart)/eatDur),bw=Math.max(72,Math.min(s,150)),bx=a+s/2-bw/2,by=b-24;x.fillStyle='#4c3424c7';rr(bx,by,bw,10,5);x.fill();x.fillStyle='#fff0ca';rr(bx+2,by+2,(bw-4)*p,6,3);x.fill();x.font='bold 12px system-ui';x.textAlign='center';x.fillStyle='#4c3424';x.fillText('もぐもぐ…',a+s/2,by-5)}}
function draw(n){let w=game.clientWidth,h=game.clientHeight;camx+=(cx()-w/2-camx)*.16;camy+=(cy()-h/2-camy)*.16;grid(w,h);for(let f of foods)food(f,n);ham(n)}function loop(n){if(!last)last=n;let dt=Math.min(33,n-last);last=n;move(dt);eatUpdate(n);if(!eating)check();time();draw(n);requestAnimationFrame(loop)}
function hide(){stick.style.display='none';knob.style.transform='translate(-50%,-50%)';active=false;pid=null;dx=dy=0}game.addEventListener('pointerdown',e=>{if(!playing)return;active=true;pid=e.pointerId;ox=e.clientX;oy=e.clientY;dx=dy=0;let r=game.getBoundingClientRect();stick.style.left=e.clientX-r.left+'px';stick.style.top=e.clientY-r.top+'px';stick.style.display='block';try{game.setPointerCapture(e.pointerId)}catch(_){}});game.addEventListener('pointermove',e=>{if(!active||e.pointerId!==pid)return;dx=e.clientX-ox;dy=e.clientY-oy;let l=Math.hypot(dx,dy),a=dx,b=dy;if(l>SM){a=dx/l*SM;b=dy/l*SM}knob.style.transform=`translate(calc(-50% + ${a}px),calc(-50% + ${b}px))`});function end(e){if(active&&e.pointerId===pid)hide()}game.addEventListener('pointerup',end);game.addEventListener('pointercancel',end);addEventListener('keydown',e=>{if(e.key==='ArrowUp')keys.up=1;if(e.key==='ArrowDown')keys.down=1;if(e.key==='ArrowLeft')keys.left=1;if(e.key==='ArrowRight')keys.right=1});addEventListener('keyup',e=>{if(e.key==='ArrowUp')keys.up=0;if(e.key==='ArrowDown')keys.down=0;if(e.key==='ArrowLeft')keys.left=0;if(e.key==='ArrowRight')keys.right=0});document.getElementById('go').onclick=start;document.getElementById('retry').onclick=start;document.getElementById('exit').onclick=()=>{document.getElementById('result').style.display='none';document.getElementById('start').style.display='flex';reset()};resize();reset();requestAnimationFrame(loop);
</script></body></html>
