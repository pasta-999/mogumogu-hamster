<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>もぐもぐハムスター - 2分チャレンジ</title><link rel="stylesheet" href="style.css?v=8"></head><body><div id="wrap"><div id="hud"><div class="top"><div class="stat">⏱️ <b id="timer">2:00</b></div><div class="stat">🐹 Lv.<b id="lv">1</b></div><div class="stat">成長<div class="bar"><div id="fill"></div></div></div><div class="stat scoreStat">SCORE <b id="score">0</b></div></div><div id="hint">種をパクッ、クッキーはモグモグ。食べたあとはほっぺがぷくっ！</div></div><div id="game"><canvas id="canvas"></canvas><div id="toast"></div><div id="stick"><div id="knob"></div></div><div id="start" class="ov"><div class="card"><h1>もぐもぐハムスター</h1><p>真上視点・0.5倍カメラの軽量化版。<br>ひまわりの種は1×1の「種」表示、ハムスターは2×2＝4マスからスタート。<br>いちごは一旦お休み。クッキーは最初は少し時間をかけてモグモグ。<br>食べ終わると数秒だけ頬袋がぷくっと膨らむよ。<br><b>制限時間は2分！</b></p><button id="go">あそぶ</button></div></div><div id="result" class="ov" style="display:none"><div class="card"><h1>RESULT</h1><div class="big" id="fs">0</div><div class="res"><div>食べた数<b id="fe">0</b></div><div>最終Lv<b id="fl">1</b></div><div>ハムスター<b id="fh">2×2</b></div><div>最大食材<b id="ff">-</b></div></div><div class="actions"><button id="retry">リトライ</button><button id="exit" class="alt">終了</button></div></div></div></div></div><script src="game.js?v=8"></script><script src="balance.js?v=8"></script><script src="viewzoom.js?v=8"></script><script src="polish.js?v=8"></script></body></html>
